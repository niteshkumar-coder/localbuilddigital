<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Safe iframe environment fallbacks to prevent SecurityError DOMExceptions
        try {
          window.alert = function(msg) {
            console.warn("[Safe Alert Fallback]:", msg);
          };
          window.confirm = function(msg) {
            console.warn("[Safe Confirm Fallback]:", msg);
            return true; // Auto-confirm on safe environments
          };
        } catch (storageErr) {
          console.warn("Could not patch window dialog interfaces:", storageErr);
        }

        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          // Redefine window.fetch to support both getter and setter safely in iframe security boundaries
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(val) {
              currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var protoFetch = window.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return protoFetch;
              },
              set: function(val) {
                protoFetch = val;
              },
              configurable: true,
              enumerable: true
            });
          } catch (err) {
            console.warn("Could not patch window.fetch setter: ", err);
          }
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalBuild</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/G3tMbK2q/image.png" />
    <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/G3tMbK2q/image.png" />
    <link rel="apple-touch-icon" href="https://i.ibb.co/G3tMbK2q/image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
