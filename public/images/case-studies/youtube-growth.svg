<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F1420"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Red Area Chart Fill Gradient -->
    <linearGradient id="chartFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#FF3333" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#111724"/>
    </linearGradient>

    <!-- YouTube Red Glow -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Subtle Studio Grid -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="800" fill="url(#gridPattern)"/>

  <!-- Top Navigation Header -->
  <rect x="0" y="0" width="1200" height="70" fill="#0D121D" stroke="#1E283C" stroke-width="1"/>

  <!-- YouTube Studio Logo -->
  <g transform="translate(32, 18)">
    <!-- Red Pill Button -->
    <rect x="0" y="0" width="46" height="32" rx="8" fill="#FF0000" filter="url(#redGlow)"/>
    <!-- White Play Triangle -->
    <polygon points="18,10 18,22 28,16" fill="#FFFFFF"/>
    <!-- Brand Typography -->
    <text x="56" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">YouTube</text>
    <text x="144" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Studio</text>
  </g>

  <!-- Studio Search Bar -->
  <g transform="translate(360, 16)">
    <rect x="0" y="0" width="420" height="38" rx="8" fill="#151C2C" stroke="#253248" stroke-width="1"/>
    <!-- Search Icon -->
    <circle cx="20" cy="19" r="6" fill="none" stroke="#64748B" stroke-width="2"/>
    <line x1="24" y1="23" x2="30" y2="29" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <text x="40" y="24" font-family="sans-serif" font-size="13" fill="#64748B">Search across channel analytics and retention metrics</text>
  </g>

  <!-- Top Right Actions -->
  <g transform="translate(1000, 16)">
    <!-- Create Button -->
    <rect x="0" y="0" width="105" height="38" rx="8" fill="#FF0000" fill-opacity="0.15" stroke="#FF0000" stroke-opacity="0.4" stroke-width="1"/>
    <polygon points="18,14 18,24 26,19" fill="#FF4E45"/>
    <text x="32" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#FF4E45">CREATE</text>
    <!-- Channel Avatar Badge -->
    <circle cx="140" cy="19" r="17" fill="#3157D5"/>
    <text x="140" y="24" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">LB</text>
  </g>

  <!-- Left Sidebar Navigation -->
  <g transform="translate(0, 70)">
    <rect width="210" height="730" fill="#0B0F19" stroke="#1A2234" stroke-width="1"/>
    
    <!-- Channel Profile Info -->
    <g transform="translate(24, 24)">
      <circle cx="24" cy="24" r="24" fill="#1E293B" stroke="#3157D5" stroke-width="2"/>
      <text x="24" y="30" font-family="sans-serif" font-size="15" font-weight="800" fill="#38BDF8" text-anchor="middle">LB</text>
      <text x="60" y="20" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">LocalBuild Growth</text>
      <text x="60" y="36" font-family="sans-serif" font-size="11" fill="#64748B">Verified Channel</text>
    </g>

    <!-- Menu Items -->
    <!-- 1. Dashboard -->
    <g transform="translate(16, 90)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Dashboard</text>
    </g>

    <!-- 2. Content -->
    <g transform="translate(16, 134)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Content</text>
    </g>

    <!-- 3. Analytics (Active Item) -->
    <g transform="translate(16, 178)">
      <rect x="0" y="0" width="178" height="42" rx="8" fill="#FF0000" fill-opacity="0.14" stroke="#FF0000" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="-16" y="0" width="4" height="42" fill="#FF0000"/>
      <!-- Analytics Icon (Chart Bars) -->
      <rect x="16" y="22" width="3.5" height="10" fill="#FF4E45"/>
      <rect x="22" y="16" width="3.5" height="16" fill="#FF4E45"/>
      <rect x="28" y="12" width="3.5" height="20" fill="#FF4E45"/>
      <text x="42" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#FF4E45">Analytics</text>
    </g>

    <!-- 4. Comments -->
    <g transform="translate(16, 226)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Comments</text>
    </g>

    <!-- 5. Subtitles -->
    <g transform="translate(16, 270)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Subtitles</text>
    </g>

    <!-- 6. Monetization -->
    <g transform="translate(16, 314)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Monetization</text>
    </g>

    <!-- 7. Customization -->
    <g transform="translate(16, 358)">
      <rect x="0" y="0" width="178" height="38" rx="6" fill="transparent"/>
      <text x="42" y="24" font-family="sans-serif" font-size="13" font-weight="500" fill="#94A3B8">Customization</text>
    </g>
  </g>

  <!-- Main Analytics Canvas -->
  <g transform="translate(236, 92)">
    
    <!-- Title Strip -->
    <g>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="750" fill="#FFFFFF">Channel Analytics · Viewer Growth Pacing</text>
      <text x="0" y="44" font-family="sans-serif" font-size="12" fill="#94A3B8">Search demand optimization &amp; audience retention framework (Last 28 days)</text>
      
      <!-- Date Range Tag -->
      <rect x="740" y="4" width="190" height="34" rx="8" fill="#131C2D" stroke="#25354F" stroke-width="1"/>
      <text x="835" y="26" font-family="sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">Oct 1 – Oct 28 (Record High)</text>
    </g>

    <!-- 4 KPI Cards Grid -->
    <g transform="translate(0, 64)">
      <!-- Card 1: Views -->
      <g transform="translate(0, 0)">
        <rect width="218" height="96" rx="12" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Monthly Views</text>
        <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">124,000</text>
        <g transform="translate(18, 72)">
          <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">▲ +570%</text>
          <text x="60" y="10" font-family="sans-serif" font-size="11" fill="#64748B">vs typical</text>
        </g>
      </g>

      <!-- Card 2: Watch Time -->
      <g transform="translate(236, 0)">
        <rect width="218" height="96" rx="12" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Watch Time</text>
        <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">14,200 <tspan font-size="16" font-weight="500" fill="#94A3B8">hrs</tspan></text>
        <g transform="translate(18, 72)">
          <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">▲ +410%</text>
          <text x="60" y="10" font-family="sans-serif" font-size="11" fill="#64748B">retention lift</text>
        </g>
      </g>

      <!-- Card 3: Subscribers -->
      <g transform="translate(472, 0)">
        <rect width="218" height="96" rx="12" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Subscribers Gained</text>
        <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="800" fill="#FFFFFF">+8,450</text>
        <g transform="translate(18, 72)">
          <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">▲ +340%</text>
          <text x="60" y="10" font-family="sans-serif" font-size="11" fill="#64748B">converting</text>
        </g>
      </g>

      <!-- Card 4: Thumbnail CTR -->
      <g transform="translate(708, 0)">
        <rect width="222" height="96" rx="12" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="18" y="26" font-family="sans-serif" font-size="12" font-weight="600" fill="#94A3B8">Thumbnail CTR</text>
        <text x="18" y="60" font-family="sans-serif" font-size="28" font-weight="800" fill="#FF4E45">8.4%</text>
        <g transform="translate(18, 72)">
          <text x="0" y="10" font-family="sans-serif" font-size="11" font-weight="700" fill="#10B981">▲ 3.2x</text>
          <text x="44" y="10" font-family="sans-serif" font-size="11" fill="#64748B">Top 1% benchmark</text>
        </g>
      </g>
    </g>

    <!-- Main Chart Section: YouTube Studio Style Trajectory -->
    <g transform="translate(0, 180)">
      <rect width="640" height="280" rx="14" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
      
      <!-- Chart Header -->
      <g transform="translate(22, 22)">
        <text x="0" y="0" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Views Trajectory vs Previous Period</text>
        <text x="0" y="18" font-family="sans-serif" font-size="11" fill="#64748B">Your channel received 124,000 views in the last 28 days.</text>
      </g>

      <!-- Chart Grid Lines -->
      <g transform="translate(30, 70)">
        <line x1="0" y1="0" x2="580" y2="0" stroke="#253248" stroke-dasharray="4 4" stroke-width="1"/>
        <text x="585" y="4" font-family="sans-serif" font-size="10" fill="#64748B">6K/d</text>

        <line x1="0" y1="50" x2="580" y2="50" stroke="#253248" stroke-dasharray="4 4" stroke-width="1"/>
        <text x="585" y="54" font-family="sans-serif" font-size="10" fill="#64748B">4K/d</text>

        <line x1="0" y1="100" x2="580" y2="100" stroke="#253248" stroke-dasharray="4 4" stroke-width="1"/>
        <text x="585" y="104" font-family="sans-serif" font-size="10" fill="#64748B">2K/d</text>

        <line x1="0" y1="150" x2="580" y2="150" stroke="#253248" stroke-width="1"/>
        <text x="585" y="154" font-family="sans-serif" font-size="10" fill="#64748B">0</text>

        <!-- Area Curve -->
        <path d="M 0 142 
                 C 50 140, 100 135, 150 120 
                 C 200 105, 250 110, 300 80 
                 C 350 50, 400 65, 450 30 
                 C 500 10, 540 8, 580 4 
                 L 580 150 L 0 150 Z" 
              fill="url(#chartFillGrad)"/>

        <!-- Main Glowing Red Line -->
        <path d="M 0 142 
                 C 50 140, 100 135, 150 120 
                 C 200 105, 250 110, 300 80 
                 C 350 50, 400 65, 450 30 
                 C 500 10, 540 8, 580 4" 
              fill="none" stroke="#FF0000" stroke-width="3.5" filter="url(#redGlow)"/>

        <!-- Milestone Dot 1 -->
        <circle cx="150" cy="120" r="4.5" fill="#FFFFFF" stroke="#FF0000" stroke-width="2.5"/>

        <!-- Milestone Dot 2 -->
        <circle cx="300" cy="80" r="4.5" fill="#FFFFFF" stroke="#FF0000" stroke-width="2.5"/>

        <!-- Active Peak Dot & Tooltip -->
        <circle cx="450" cy="30" r="6" fill="#FF0000" stroke="#FFFFFF" stroke-width="2.5" filter="url(#redGlow)"/>
        
        <!-- Floating Tooltip Box -->
        <g transform="translate(370, -46)">
          <rect width="165" height="46" rx="8" fill="#0A0F1A" stroke="#FF0000" stroke-width="1.5" filter="url(#cardShadow)"/>
          <text x="12" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Day 21 · Algorithm Peak</text>
          <text x="12" y="34" font-family="sans-serif" font-size="10" font-weight="600" fill="#10B981">+7,240 views · 8.4% CTR</text>
        </g>
      </g>

      <!-- Bottom Timeline Labels -->
      <g transform="translate(30, 245)">
        <text x="0" y="0" font-family="sans-serif" font-size="10" fill="#64748B">Day 1</text>
        <text x="145" y="0" font-family="sans-serif" font-size="10" fill="#64748B">Day 7</text>
        <text x="295" y="0" font-family="sans-serif" font-size="10" fill="#64748B">Day 14</text>
        <text x="445" y="0" font-family="sans-serif" font-size="10" fill="#64748B">Day 21</text>
        <text x="565" y="0" font-family="sans-serif" font-size="10" fill="#64748B">Day 28</text>
      </g>
    </g>

    <!-- Right Side Panel: Top Video Performance & Realtime -->
    <g transform="translate(660, 180)">
      
      <!-- Top Video Card -->
      <g transform="translate(0, 0)">
        <rect width="270" height="150" rx="14" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        <text x="18" y="24" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Top Performing Video</text>
        
        <!-- Video Preview Row -->
        <g transform="translate(18, 38)">
          <!-- Video Thumbnail Box -->
          <rect width="100" height="58" rx="8" fill="#0A0F18" stroke="#25354F" stroke-width="1"/>
          <!-- Play Badge -->
          <rect x="36" y="17" width="28" height="20" rx="5" fill="#FF0000"/>
          <polygon points="48,22 48,32 55,27" fill="#FFFFFF"/>
          <rect x="68" y="42" width="28" height="12" rx="3" fill="#000000" fill-opacity="0.8"/>
          <text x="82" y="51" font-family="sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">14:32</text>
          
          <!-- Video Metadata -->
          <text x="110" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Client Acquisition</text>
          <text x="110" y="32" font-family="sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">Blueprint (2026)</text>
          <text x="110" y="50" font-family="sans-serif" font-size="10" fill="#10B981">92,400 views · 98%</text>
        </g>

        <!-- Metric Bars -->
        <g transform="translate(18, 112)">
          <text x="0" y="12" font-family="sans-serif" font-size="10" fill="#94A3B8">Avg View Duration:</text>
          <text x="110" y="12" font-family="sans-serif" font-size="10" font-weight="700" fill="#FFFFFF">6m 55s (3.2x avg)</text>
          <text x="0" y="28" font-family="sans-serif" font-size="10" fill="#94A3B8">Viewer Retention:</text>
          <text x="110" y="28" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">62% at 5 min mark</text>
        </g>
      </g>

      <!-- Realtime Activity Card -->
      <g transform="translate(0, 166)">
        <rect width="270" height="114" rx="14" fill="url(#cardGrad)" stroke="#1F2A3F" stroke-width="1" filter="url(#cardShadow)"/>
        
        <!-- Header -->
        <g transform="translate(18, 22)">
          <!-- Glowing Pulse Indicator -->
          <circle cx="4" cy="4" r="4" fill="#10B981" filter="url(#redGlow)"/>
          <text x="16" y="8" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Realtime · Updating Live</text>
          <text x="0" y="26" font-family="sans-serif" font-size="20" font-weight="800" fill="#38BDF8">48,290 <tspan font-size="11" font-weight="500" fill="#94A3B8">subs</tspan></text>
        </g>

        <!-- Mini Realtime Bar Chart -->
        <g transform="translate(18, 70)">
          <!-- 12 Bars -->
          <rect x="0" y="18" width="8" height="18" rx="2" fill="#25354F"/>
          <rect x="12" y="14" width="8" height="22" rx="2" fill="#25354F"/>
          <rect x="24" y="20" width="8" height="16" rx="2" fill="#25354F"/>
          <rect x="36" y="12" width="8" height="24" rx="2" fill="#25354F"/>
          <rect x="48" y="16" width="8" height="20" rx="2" fill="#25354F"/>
          <rect x="60" y="10" width="8" height="26" rx="2" fill="#38BDF8"/>
          <rect x="72" y="8" width="8" height="28" rx="2" fill="#38BDF8"/>
          <rect x="84" y="6" width="8" height="30" rx="2" fill="#38BDF8"/>
          <rect x="96" y="4" width="8" height="32" rx="2" fill="#38BDF8"/>
          <rect x="108" y="2" width="8" height="34" rx="2" fill="#10B981"/>
          <rect x="120" y="0" width="8" height="36" rx="2" fill="#10B981"/>
          <rect x="132" y="0" width="8" height="36" rx="2" fill="#10B981" filter="url(#redGlow)"/>
          <text x="150" y="22" font-family="sans-serif" font-size="10" font-weight="700" fill="#10B981">4,820 / hr</text>
        </g>
      </g>

    </g>

  </g>

</svg>
